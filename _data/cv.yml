    Projects:
      - name: "Beam Angle Selection of Non-Coplanar Fields in Proton Therapy"
        summary: "MSc thesis, EPFL / AMAS Lab, PSI (2023). This study delves into two distinct strategies for addressing the challenge of predicting beam angles of non-coplanar fields in proton therapy, applied to cranial tumours. The initial approach utilises Convolutional Neural Networks (CNNs), investigated through both supervised and unsupervised learning paradigms; these were assessed for their ability to forecast angles for a single field only, but performance remained unsatisfactory, primarily due to limitations in available patient data. The second approach introduces a novel gradient descent variation tailored to angles prediction for three non-coplanar fields, yielding promising outcomes within reasonable computational time. The predicted plans' efficacy was benchmarked against clinical reference plans."
        start_date: 2023
        end_date: 2023

      - name: "Differentiable Influence Matrix Calculation Using Automatic Differentiation"
        summary: "Internship project, AMAS Lab / Center for Proton Therapy, PSI (2022–2023). Rewrote FIonA's dose-influence-matrix calculation (water-equivalent depth and Dij elements) as a differentiable pipeline in Julia using automatic differentiation (Enzyme.jl), to enable gradient-based optimization of spot positions, energies, and field angles."
        start_date: 2022
        end_date: 2023

      - name: "Road Segmentation with a Double U-Net"
        summary: "Machine Learning course, EPFL (2021). Studied a new convolutional neural network architecture for road segmentation of satellite images."
        start_date: 2021
        end_date: 2021

      - name: "Estimation of the Sacherer Tune Shift with Perturbed Mode Spectra"
        summary: "Particle Accelerator Physics Laboratory (LPAP), EPFL, in partnership with CERN (2021). Studied a new approach for a Vlasov solver."
        start_date: 2021
        end_date: 2021

      - name: "Feasibility Study for a Muon Source Based on a Long Magnetized Target for Collider Application"
        summary: "LPAP, EPFL (2020). Analysis of the feasibility of magnetic elements following the requirements of a muon source."
        start_date: 2020
